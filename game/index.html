<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>GLASSLINE — Veyra</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a141c; font-family: 'Segoe UI', system-ui, sans-serif; color: #e8eef2; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .topbar { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
  #wanted { font-size: 28px; letter-spacing: 4px; color: #ffd75e; text-shadow: 0 0 12px rgba(255, 180, 60, .6); }
  #wanted.hot { color: #ff5a5a; text-shadow: 0 0 14px rgba(255, 60, 60, .8); animation: pulse .7s infinite alternate; }
  @keyframes pulse { from { opacity: .7; } to { opacity: 1; } }
  #money { font-size: 22px; font-weight: 700; color: #7ee2a0; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  #mission { position: absolute; top: 60px; left: 16px; font-size: 15px; font-weight: 700; color: #ffb347; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #objective { position: absolute; top: 84px; left: 16px; font-size: 14px; color: #dfe9f0; background: rgba(8, 16, 24, .6); padding: 6px 10px; border-radius: 6px; max-width: 420px; }
  #speed { position: absolute; right: 16px; bottom: 18px; font-size: 26px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #health { position: absolute; right: 16px; bottom: 52px; font-size: 13px; color: #b9c8d4; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #health.low { color: #ff7a7a; }
  #radio { position: absolute; left: 16px; bottom: 18px; font-size: 13px; color: #9fd8e8; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #minimap { position: absolute; right: 16px; top: 14px; width: 180px; height: 180px; border: 2px solid rgba(160, 190, 210, .35); border-radius: 8px; background: rgba(8, 16, 24, .7); }
  #banner { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); font-size: 42px; font-weight: 800; letter-spacing: 3px; color: #fff; text-shadow: 0 0 24px rgba(255, 179, 71, .9), 0 2px 10px rgba(0,0,0,.9); opacity: 0; transition: opacity .4s; text-align: center; }
  #banner.show { opacity: 1; }
  #toast { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); font-size: 15px; background: rgba(8, 16, 24, .78); padding: 10px 18px; border-radius: 8px; opacity: 0; transition: opacity .4s; max-width: 640px; text-align: center; }
  #toast.show { opacity: 1; }
  #screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(4, 10, 16, .72); z-index: 10; pointer-events: auto; }
  #screen.show { display: flex; }
  .panel { background: rgba(10, 20, 28, .95); border: 1px solid rgba(255, 179, 71, .45); border-radius: 14px; padding: 32px 36px; max-width: 560px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .panel h1 { font-size: 38px; letter-spacing: 6px; color: #ffb347; margin-bottom: 10px; }
  .panel p { margin: 10px 0; line-height: 1.5; }
  .panel .tag { color: #c8d6e0; }
  .panel .dim { color: #8ba0b0; font-size: 13px; }
  .panel button { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; font-weight: 700; color: #0a141c; background: #ffb347; border: none; border-radius: 8px; cursor: pointer; }
  .panel button:hover { background: #ffc46e; }
  .panel input[type=range] { vertical-align: middle; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0a141c; z-index: 20; color: #ff9a9a; font-size: 18px; padding: 40px; text-align: center; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="topbar">
    <div id="wanted">☆☆☆☆☆</div>
    <div id="money">$120</div>
  </div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="mission"></div>
  <div id="objective"></div>
  <div id="speed"></div>
  <div id="health"></div>
  <div id="radio"></div>
  <div id="banner"></div>
  <div id="toast"></div>
</div>
<div id="screen"></div>
<div id="err"></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
  window.addEventListener('error', (e) => {
    const el = document.getElementById('err');
    el.style.display = 'flex';
    el.textContent = 'GLASSLINE gagal dimuat: ' + (e.message || 'error');
  });
  import('./src/main.js').catch((err) => {
    const el = document.getElementById('err');
    el.style.display = 'flex';
    el.textContent = 'GLASSLINE gagal dimuat: ' + err.message;
  });
</script>
</body>
</html>
